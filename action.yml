name: 'Install Mesa Windows'
description: 'Install Mesa Windows binaries to a specific directory'
branding:
  icon: 'arrow-down'
  color: 'gray-dark'
inputs:
  path:
    description: 'path to install binaries to, supports wildcard'
    required: true
  version:
    description: 'mesa version to install'
    required: false
    default: 26.3.1
  cpu:
    description: "CPU architecture to install"
    required: false
    default: "x64"
  implementation:
    description: "Implementation to install"
    required: false
    default: "llvmpipe"

runs:
  using: "composite"
  steps:

    - name: Check required inputs
      shell: bash
      run: |
        [[ "${{ inputs.path }}" ]] || { echo "path input is empty" ; exit 1; }

    - name: Download and install Mesa windows
      shell: powershell
      run: |
        mkdir install_mesa_local_dir
        cd install_mesa_local_dir
        curl.exe -L --output install_mesa_local_archive.7z --url https://github.com/mmozeiko/build-mesa/releases/download/${{inputs.version}}/mesa-${{inputs.implementation}}-${{inputs.cpu}}-${{inputs.version}}.7z
        C:\'Program Files'\7-Zip\7z.exe x install_mesa_local_archive.7z
        # Create the directories if they do not exist
        Get-ChildItem -Directory ${{inputs.path}}* | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ }
        # A * is added next line to force Get-ChildItem to look for directory within the path
        Get-ChildItem -Directory ${{inputs.path}}* | ForEach-Object { Copy-Item -Path .\opengl32.dll, .\libEGL.dll, -Destination $_ }
        cd ..
        rm .\install_mesa_local_dir -r -force
